services:
  clientdesk:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      ADMIN_TOKEN: replace-with-at-least-24-private-characters
      DATABASE_PATH: /app/runtime/clientdesk.db
      SEED_DEMO_DATA: "false"
    volumes:
      - clientdesk-data:/app/runtime

volumes:
  clientdesk-data:

