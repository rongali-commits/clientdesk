[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clientdesk"
version = "1.0.0"
description = "A white-label client onboarding, project, approval, and delivery portal."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1.0",
  "python-dotenv>=1.1,<2.0",
  "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.4,<9.0",
  "ruff>=0.12,<1.0",
]

[project.scripts]
clientdesk = "clientdesk.app:run"

[tool.hatch.build.targets.wheel]
packages = ["src/clientdesk"]

[tool.hatch.build.targets.wheel.force-include]
"data/business.json" = "clientdesk/defaults/business.json"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

